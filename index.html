<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Erica 2 — Voice Agent</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Azure Speech SDK (with fallback) -->
    <script>
        window.__sdkLoaded = false;
        function __onSdkLoad() { window.__sdkLoaded = true; }
        function __onSdkError(src) {
            console.error("Failed to load Speech SDK from", src);
            // Try fallback CDN
            if (src.indexOf("unpkg") === -1) {
                var s = document.createElement("script");
                s.src = "https://unpkg.com/microsoft-cognitiveservices-speech-sdk@1.40.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js";
                s.onload = __onSdkLoad;
                s.onerror = function () { __onSdkError(s.src); };
                document.head.appendChild(s);
            }
        }
    </script>
    <script
        src="https://aka.ms/csspeech/jsbrowserpackageraw"
        onload="__onSdkLoad()"
        onerror="__onSdkError(this.src)"></script>
</head>
<body>
    <!-- Settings Modal -->
    <div id="settingsOverlay" class="settings-overlay hidden">
        <div class="settings-modal">
            <h2>Erica 2 — Configuration</h2>
            <p class="settings-note">Your keys are saved in this browser only. They are never sent to any server.</p>
            <label>
                Azure Speech Key
                <input id="cfgSpeechKey" type="password" placeholder="Paste your Speech key here" autocomplete="off" />
            </label>
            <label>
                Azure Speech Region
                <input id="cfgSpeechRegion" type="text" placeholder="e.g. eastus2" autocomplete="off" />
            </label>
            <label>
                Copilot Studio Direct Line Secret
                <input id="cfgDlSecret" type="password" placeholder="Paste your Direct Line secret here" autocomplete="off" />
            </label>
            <div class="settings-actions">
                <button id="settingsSave" class="settings-save-btn">Save &amp; Connect</button>
                <button id="settingsCancel" class="settings-cancel-btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Floating launcher (visible when chat is minimized) -->
    <button id="launcher" class="launcher" title="Chat with Erica 2" aria-label="Open chat">
        <svg viewBox="0 0 100 100" width="100%" height="100%">
            <rect x="18" y="22" width="64" height="58" rx="14" fill="#fff"/>
            <line x1="50" y1="22" x2="50" y2="10" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
            <circle cx="50" cy="8" r="4" fill="#ffd166"/>
            <circle cx="38" cy="45" r="6" fill="#2b2d42"/>
            <circle cx="62" cy="45" r="6" fill="#2b2d42"/>
            <circle cx="40" cy="43" r="1.8" fill="#fff"/>
            <circle cx="64" cy="43" r="1.8" fill="#fff"/>
            <rect x="38" y="60" width="24" height="6" rx="3" fill="#2b2d42"/>
            <circle cx="28" cy="58" r="3" fill="#ff8fa3" opacity="0.6"/>
            <circle cx="72" cy="58" r="3" fill="#ff8fa3" opacity="0.6"/>
        </svg>
    </button>

    <div id="chatContainer" class="chat-container">
        <header class="chat-header">
            <div class="avatar-wrap">
                <div id="avatar" class="avatar">
                    <!-- Friendly robot face SVG -->
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <!-- Head -->
                        <rect x="18" y="22" width="64" height="58" rx="14" fill="#fff"/>
                        <!-- Antenna -->
                        <line x1="50" y1="22" x2="50" y2="10" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
                        <circle cx="50" cy="8" r="4" fill="#ffd166"/>
                        <!-- Eyes -->
                        <circle class="eye left" cx="38" cy="45" r="6" fill="#2b2d42"/>
                        <circle class="eye right" cx="62" cy="45" r="6" fill="#2b2d42"/>
                        <circle cx="40" cy="43" r="1.8" fill="#fff"/>
                        <circle cx="64" cy="43" r="1.8" fill="#fff"/>
                        <!-- Mouth (animated) -->
                        <rect id="mouth" class="mouth" x="38" y="60" width="24" height="6" rx="3" fill="#2b2d42"/>
                        <!-- Cheeks -->
                        <circle cx="28" cy="58" r="3" fill="#ff8fa3" opacity="0.6"/>
                        <circle cx="72" cy="58" r="3" fill="#ff8fa3" opacity="0.6"/>
                    </svg>
                </div>
            </div>
            <div class="header-info">
                <h1>Erica 2</h1>
                <span class="subtitle">Your voice assistant</span>
            </div>
            <span id="status" class="status idle">Idle</span>
            <button id="settingsBtn" class="settings-btn" title="Settings" aria-label="Settings">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                    <path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.02 7.02 0 0 0-1.62-.94l-.36-2.54A.484.484 0 0 0 14 2h-3.84a.484.484 0 0 0-.48.42l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.476.476 0 0 0-.59.22L3.8 8.48a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.47.47 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.37 1.03.7 1.62.94l.36 2.54c.05.24.27.42.48.42h3.84c.24 0 .44-.18.48-.42l.36-2.54c.59-.24 1.13-.57 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.47.47 0 0 0-.12-.61l-2.03-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                </svg>
            </button>
            <button id="minimizeBtn" class="minimize-btn" title="Minimize" aria-label="Minimize chat">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M5 13h14v-2H5v2z"/>
                </svg>
            </button>
        </header>

        <div id="transcript" class="transcript">
            <div class="message bot">
                <div class="bubble">Hi! I'm Erica 2 👋 Click the microphone or type to ask me anything.</div>
            </div>
        </div>

        <footer class="chat-footer">
            <form id="chatForm" class="chat-form">
                <input
                    id="chatInput"
                    type="text"
                    class="chat-input"
                    placeholder="Type a message…"
                    autocomplete="off"
                    disabled />
                <button id="sendBtn" type="submit" class="send-btn" title="Send" disabled>
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
                    </svg>
                </button>
            </form>
            <button id="micBtn" class="mic-btn" title="Click to talk" disabled>
                <!-- Mic icon (SVG) -->
                <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                    <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
                    <path d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V21H8a1 1 0 0 0 0 2h8a1 1 0 0 0 0-2h-3v-3.08A7 7 0 0 0 19 11z"/>
                </svg>
            </button>
            <button id="endBtn" class="end-btn" title="End conversation" disabled>End</button>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
